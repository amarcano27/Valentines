<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Floating hearts background -->
        <div class="hearts-container">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>

        <!-- Main content -->
        <div class="content">
            <!-- Photo Gallery Section -->
            <div class="photo-gallery">
                <div class="photo-frame heart-frame">
                    <img src="images/photo1.jpg" alt="Special moment" class="gallery-photo" id="photo1">
                    <div class="photo-placeholder">
                        <span>💕</span>
                        <p>Add photo1.jpg</p>
                    </div>
                </div>
                <div class="photo-frame circle-frame">
                    <img src="images/photo2.jpg" alt="Special moment" class="gallery-photo" id="photo2">
                    <div class="photo-placeholder">
                        <span>💖</span>
                        <p>Add photo2.jpg</p>
                    </div>
                </div>
                <div class="photo-frame heart-frame">
                    <img src="images/photo3.jpg" alt="Special moment" class="gallery-photo" id="photo3">
                    <div class="photo-placeholder">
                        <span>💝</span>
                        <p>Add photo3.jpg</p>
                    </div>
                </div>
            </div>

            <div class="question-box">
                <h1 class="question">Will you be my Valentine?</h1>
                <div class="heart-icon">💖</div>
            </div>

            <div class="buttons-container">
                <button class="btn btn-yes" onclick="handleResponse('yes')">
                    Yes
                </button>
                <button class="btn btn-yes-big" onclick="handleResponse('YES')">
                    YES
                </button>
                <button class="btn btn-forever" onclick="handleResponse('forever')">
                    FOREVER
                </button>
            </div>

            <!-- Response message (hidden initially) -->
            <div id="response-message" class="response-message hidden">
                <div class="celebration">
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                </div>
                <h2 id="response-text"></h2>
                <div class="sparkles">✨✨✨</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
